summary: >
  Proved ledger_partial_withdrawal (ArmadaLean/Nitro/Liveness.lean). The
  statement did not change. The strategy is two rounds with no wait: p
  concludes L, then p transfers the entry of the destination x from L
  (Nitro:1046-1047). One generic lemma, conclude_transfer_pays, gives the
  strategy for one destination. The theorem uses it for x = dA (amount a')
  and for x = L' (amount a + b + c, for A and for B). The slack invariant
  (Adjudicator.PayPhase, Adjudicator.PaysAtLeast) runs over the Step runs
  of each round (Threat.RoundSeq.steps). The first finalization of L
  records the conclusion outcome, because the outcome at the end of the
  round (conclude_round_finalized, extracted from
  conclusion_proof_finalizable) is stable. transfer_round_pays pays the
  whole entry at the landing (transfer_can_happen). channel_stays_open_round
  keeps L' open for the two rounds, so L' loses no coins. No proof
  discharges a Threat.Round hypothesis by contradiction. The commit
  removes the captured scaffolding that had no use: conclude_round_funded,
  now_apply_eq_of_not_tick (a copy of Adjudicator.apply_now_eq_of_not_tick),
  Threat.RoundSeq.finalOutcome_isSome_mono, and ArmadaLean/Nitro/Probe.lean
  (the sorry probe that made axioms_ok false). hinv_adj_step becomes
  open_step. `#print axioms ArmadaLean.Nitro.ledger_partial_withdrawal`
  shows only propext, Classical.choice, Quot.sound.
