summary: >
  Replaced the `sorry` proof body of `turbo_value_exists_unique`
  (ArmadaLean/Nitro/Liveness.lean) with a complete proof; the theorem's
  statement is unchanged. Existence builds a concrete finite required-node
  list (balances keys, channels named in status, and their allocation
  targets) and a generic topological-sort existence lemma over
  `Relation.TransGen s.Edge` (well-founded minimal-element selection via
  `Set.Finite.wellFoundedOn`). Uniqueness shows `turboValues` only depends
  on the subsequence of nodes with a nonempty own allocation (processing an
  empty-allocation node is a no-op), then proves any two valid topological
  orders restricted to that fixed finite set give the same result by strong
  induction: repeatedly move a source node (no predecessor) to the front
  without changing the result (using `payoutValues`' vals-affine structure
  to commute two independent payouts), recursing on the smaller remaining
  set, with the two orders' edge constraints transported across element
  removal and filtering via Nodup index-uniqueness
  (`List.getElem?_inj`). All ~20 new lemmas live in
  ArmadaLean/Nitro/Value.lean (where `TurboValue`/`turboValues` are
  defined), already transitively imported by Liveness.lean, so no import
  graph change was needed. Verified by installing a local Lean 4.33.1 +
  mathlib toolchain (none was present in the worktree), running
  `lake build` (exit 0, only pre-existing unrelated warnings), and running
  `scripts/check.sh --json turbo_value_exists_unique`, which reports
  `build_ok: true`, `theorem_in_sorry: false`, `signatures_ok: true`, exit
  0 — matching both acceptance tests in the linked spec. Also confirmed via
  `#print axioms turbo_value_exists_unique`: only `propext`,
  `Classical.choice`, `Quot.sound` (no `sorryAx`).
