summary: >
  Replaced the sorry proof body of theorem participant_can_prevent_cycles
  in ArmadaLean/Nitro/Liveness.lean with a complete proof, leaving the
  statement unchanged. Added a helper lemma consensus_channel_stays_open
  that shows, by induction over Threat.FeasibleSeq (mirroring the existing
  round_keeps_status proof's case analysis over Op), that a channel whose
  participant p never signs anything stays at its starting .open status
  forever: every success path for challenge/checkpoint
  (consensusRules.supports) or conclude (ConclusionProof) on that channel
  needs a state signed by every one of the channel's participants, which
  by p's membership needs p's genuine signature, which Bounds.unforgeable
  ties to a witness in p's sent list, impossible while that list stays
  empty. The main theorem combines this with an induction over Run (using
  the constant .wait 0 strategy) to carry the open-forever invariant to
  every reachable state, then shows an open channel has no finalized
  outcome and hence no outgoing allocation edge, so
  Relation.TransGen.head'_iff has no first step to find, closing the
  cycle (mirroring the existing g0_dag proof's technique). Verified by
  installing the project's pinned toolchain (elan/lake v4.33.1, isolated
  under this invocation's own HOME, never touching any shared install)
  and running `lake build` for the whole project (595 jobs, 0 errors,
  ArmadaLean.Nitro.NonVacuity included) and
  `scripts/check.sh --json participant_can_prevent_cycles`, which reports
  build_ok=true, theorem_in_sorry=false, signatures_ok=true,
  nonvacuity_ok=true, axioms_ok=true — both acceptance predicates named by
  the linked spec.
