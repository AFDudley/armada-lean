summary: >
  Proved conclusion_proof_finalizable in ArmadaLean/Nitro/Liveness.lean,
  replacing its sorry body with a real proof; the theorem's name, argument
  list, and conclusion are byte-identical to before. Strategy: case on the
  given hypothesis that channel c is already finalized with Omega (done
  immediately) or not yet finalized (finalizedWith = none); in the latter
  case p plays the honest chain-conclude move carrying its held
  ConclusionProof. A new lemma round_keeps_status (added just above the
  theorem, along with three small supporting lemmas
  NetworkState.applyAdv_sent, NetworkState.applyAdv_now_le, and
  Threat.FeasibleSeq.now_le) shows by induction over the adversary's
  feasible move sequence that channel c's on-chain record stays either
  open or finalized with Omega throughout the round: a finalized-with-Omega
  record stays so (reusing the existing Adjudicator.finalizedWith_apply
  argument), a challenge the adversary (re-)creates on c cannot expire
  before the round ends (its deadline is challengeDuration >= 2*eps past
  the current clock, and the round itself ends strictly before eps has
  passed, per hdur/hpend/the round's own bound), and an adversary-submitted
  conclude on c still needs p's genuine signature (Bounds.unforgeable),
  which p only ever put on a final state of c that already carries Omega
  (hsent), so it cannot finalize c with any other outcome. From that
  invariant, p's own conclude either lands (channel was open, finalizing it
  with Omega via hΩ/hproof) or no-ops because the channel was already
  finalized with Omega by the adversary, either way giving the required
  net'.Finalized c Omega. Verified by running scripts/check.sh --json
  conclusion_proof_finalizable (prints theorem_in_sorry: false, build_ok:
  true) and the full scripts/check.sh (every check PASSes; sorry count
  drops from the pre-existing 34 to 33, with conclusion_proof_finalizable
  no longer in the printed SORRY list), and lake build of the whole project
  (595 jobs) succeeding with no new warnings.
