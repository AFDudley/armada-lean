summary: >
  Proved channel_finalizability_cases in ArmadaLean/Nitro/Liveness.lean with
  no change to its statement. The theorem is a 4-way disjunction (channel
  finalized / exactly one participant has a finalizable outcome / two-or-more
  participants share one finalizable outcome with that outcome unique /
  no participant has any finalizable outcome); proving any one disjunct
  suffices, so the proof does classical case analysis on
  `∃ p ∈ c.participants, ∃ Ω, Finalizable apps (Ts.T p) c Ω (v p)` and then,
  within that, on whether any other participant also has a finalizable
  outcome. The "no participant" case closes the fourth disjunct directly via
  push_neg. The "exactly one participant" case closes the second disjunct
  directly. The "two-or-more" case closes the third disjunct: the shared
  outcome and its uniqueness across all of c.participants are both derived
  from the already-proved finalizable_unique (no new semantic lemma
  needed) by case-splitting on whether a given participant r equals the
  first witness p. The first disjunct (Finalized) is never needed since the
  other three partition all possibilities by the law of excluded middle.
  Verified by installing elan/lake (not present in the task environment,
  installed to $HOME/.elan since /root/.elan was inaccessible), running
  `lake exe cache get` then `lake build` (599/599 jobs, exit 0, no errors),
  and running `scripts/check.sh --json channel_finalizability_cases`, which
  printed build_ok=true, signatures_ok=true, theorem_in_sorry=false (sorry
  count dropped from the prior count to 17, well under the 46 baseline, and
  no approved theorem statement changed per the signatures check).
