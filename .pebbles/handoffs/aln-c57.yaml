  transact_balance lemma instantiated at bp.treeNumber and closed by omega.
  Also authored scripts/check_theorem_sorry_absent.py, the committed acceptance
  probe the linked spec (contracts/specs/derived-aln-c57.spec.json) names as its
  behavior-oracle entrypoint: it runs the real scripts/check.sh --json and relays
  check.sh's own theorem_in_sorry fact as a single stdout_json field
  (contains_sorry), judging nothing itself. Verified by installing elan/lake into
  a writable prefix (the repo's default $HOME/.elan was unwritable in this
  sandbox; used ELAN_HOME=/home/worker/.elan), running `lake build` (exits 0,
  142s), `bash scripts/check.sh --json transact_unshield_exact` (build_ok=true,
  theorem absent from sorry array, sorry_count 40 down from baseline 46), and
  `python3 scripts/check_theorem_sorry_absent.py transact_unshield_exact`
  (contains_sorry=false). Confirmed the probe discriminates: stashing the
  PoolSafety.lean change and rerunning the same probe reports
  contains_sorry=true (red before the fix), restored and reran green after.
  Full scripts/check.sh (non-JSON) gate also passes with exit 0.
