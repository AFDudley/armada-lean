summary: >
  Completed the proof of transact_unshield_exact in ArmadaLean/PoolSafety.lean,
  replacing its sorry placeholder. The witness state s' comes directly from the
  Step.transact constructor applied to the theorem's own hypotheses; the payouts
  and held equalities fall out of Step.transact's let-built state once bp.unshield
