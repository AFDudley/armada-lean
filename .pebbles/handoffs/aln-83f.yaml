summary: >
  Proved spend_not_blocked in ArmadaLean/PoolSafety.lean with no sorry in its
  own proof body, statement unchanged. SpendEnabled's three checks (root
  membership, removeAll success on the live set, markSpent success on the
  nullifier set) are re-derived at s' from three independent facts: roots
  only grow across a step (step_rootsAt_shape, already proved), each entry
  stays live in s' because hDisjoint rules out the step spending it while
  hEnabled's removeAll_perm witness places it in s.live token to begin
  with, and LiveSpentInvariant's freshness clause applied at the later
  reachable state s' directly gives each entry's nullifier is absent from
  s'.spent tn, with no need to inspect which Step constructor fired or
  relate its own removeAll/markSpent to the pending spend's. Two new
  generic completeness lemmas back the live-set half in ArmadaLean/Pool.lean:
  removeAll_none_of_not_mem and removeAll_wanted_nodup (a successful
  removeAll's wanted list has no duplicate entries, since pool.Nodup leaves
  none after the first copy is erased), and removeAll_of_subset (the
  converse of the existing removeAll_subset/removeAll_disjoint: a Nodup
  wanted list contained in a Nodup pool can always be removed). The
  nullifier half reuses the existing owned_no_double_spend/markSpent_succeeds
  pair from PoolOwned.lean unchanged. Verified by installing a scratch
  elan/lake/mathlib toolchain in this sandbox (the repo's normal elan
  install at /root is not readable by the worker user) and running the
  project's real build and acceptance script: `lake build` (full project,
  595/595 jobs, exit 0) and `scripts/check.sh --json spend_not_blocked`,
  which reports theorem_in_sorry: false and spend_not_blocked absent from
  the sorry array (the exact spec predicate), at the committed HEAD
  caeb4ea with a clean working tree. scripts/check.sh with no arguments
  also exits 0 (build, sorry-count-vs-baseline, no-vacuous-body, axioms,
  signatures, NonVacuity all PASS); scripts/sigs.py's baseline comparison
  confirms the theorem's statement text is byte-identical to
  scripts/sigs-baseline.tsv. Sorry count dropped from the baseline 46 to
  34. No other theorem's statement or proof was touched.
