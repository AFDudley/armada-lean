summary: >
  Defined Pool.Call (ArmadaLean/Pool.lean, after Pool.ContractState) as rule
  PE2 (docs/pool-executable.md) specifies: an inductive with exactly three
  constructors, each carrying only calldata and no circuit witness. `shield
  (token : Token) (x : Nat) (npk : Term)` carries the token, the gross amount
  and the note key. `transact {N M} (caller : Term) (pub : TransactPublic N M)
  (bp : BoundParams) (proof : Term) (unshieldToken : Option Token) (records :
  List (Term × CommitmentPreimage)) (openings : List (Term × OwnedOpening))`
  carries the caller, the public inputs, the bound parameters, the proof (a
  `Term`, since the model holds no Groth16 proof objects), the unshield's
  token if `bp.unshield` names one, the disclosed records and the published
  openings. `transactOwned` carries the same, minus `unshieldToken`. Built
  `.lake/packages` as a symlink to the host's pre-built /gate/.lake/packages
  (no bare `lake clean`, no copy of `.lake/build`), ran a full `lake build`,
  and verified: `python3 scripts/oracles/lean_probe.py
  scripts/oracles/pool_exec/PE2.lean` elaborates with 0 errors and `#print
  axioms Pool.Call` reports no axioms; `scripts/check.sh --json` reports
  every `_ok` field true (build, axioms, signatures, nonvacuity, reach,
  lint, decisionScope, counterexamples), exit 0, ~100s. The edit changed
  ArmadaLean/Pool.lean's sha256, so `scripts/gate_baseline_fresh_check.py`
  flagged the recorded hash as stale; ran `python3
  scripts/update_gate_baseline.py --hashes-only` (87 files, 0 decisionScope
  findings, no count changes) and committed the refreshed
  scripts/gate-baseline.json, then re-ran scripts/check.sh --json to confirm
  it stayed fully green. No axiom, sorry, admit, native_decide or #exit
  added; no file outside ArmadaLean/ created; no approved statement changed.
