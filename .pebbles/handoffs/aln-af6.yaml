summary: >
  Proved turbo_redistribution_unbeatable (ArmadaLean/Nitro/Liveness.lean,
  Nitro:775-777) with no change to its statement. The strategy replays
  `ops`, one transfer per round (turbo_replay_unbeatable). The proof uses
  a new relation, Adjudicator.Ahead sp sg (Lemmas.lean): sg is where sp
  goes after more transfers. An adversary transfer keeps the relation
  (Ahead.transfer_right). The same transfer in both states keeps it
  (Ahead.transfer). An external balance is never lower in the state ahead
  (Ahead.get_external_le). Ahead.applyAll_sublist lifts the two step
  lemmas to any transfer list that contains the replayed list as a
  subsequence (Nitro:842-843, "calling transfers out of order does not
  affect the ultimate result"); turbo_order_independent can use it.
  Threat.RoundSeq.transfers reads a round with no pending call as one
  applyAll of adversary transfers, so a round of p's move is
  A1 ++ [p's transfer] ++ A2. Per channel, Allocation.AheadOf uses the
  closed priority formula paidTo_eq_min (Nitro:747-749). The earlier
  paidToSeen recursion and its two lemmas (4f4fba8, a2717ce) had no use in
  this proof, so 9ba3d14 removes them. The proof does not use the
  hypotheses B, hcap, hr or hdag; Lean reports them as unused variables.
  The DAG restriction of Nitro:791-796 is not necessary for this theorem.
  Every declaration is under 60 lines; the largest are
  Ahead.transfer_both (54), transfer_effect (53) and
  turbo_replay_unbeatable (52). The axioms are propext, Classical.choice
  and Quot.sound.
