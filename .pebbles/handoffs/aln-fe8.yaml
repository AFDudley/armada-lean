summary: >
  Added `Pool.ContractState` to ArmadaLean/Pool.lean: a six-field structure
  holding exactly the state a real pool contract stores on-chain (trees,
  spent, held, preimageOf, treasuryFees, feeRatio — Merkle trees, the
  nullifier set of each tree, token custody, the preimage registry, treasury
  fees, and the fee rate), with field order matching the committed probe's
  anonymous-constructor shape. Added `PoolState.contract : PoolState ->
  Pool.ContractState`, mapping a full model state to those same six fields by
  `rfl`, dropping the ghost fields `live`, `published` and `payouts`. No
  existing declaration, signature, or statement was touched. Refreshed
  scripts/gate-baseline.json via `scripts/update_gate_baseline.py` (full,
  non-hashes-only run) to pick up the new file hash and the +1
  decls_scanned/pool_decls denominators; no LINT_REGRESSION_FIELDS count
  moved and decisionScope findings stayed at 0. Verified end to end: `lake
  build` succeeds (1066/1066 jobs); `scripts/check.sh --json` (full gate)
  exits 0 with every _ok field true (build_ok, axioms_ok, signatures_ok,
  nonvacuity_ok, reach_ok, lint_ok, decision_ok, counterexamples_ok) in
  128.97s; `python3 scripts/oracles/lean_probe.py
  scripts/oracles/pool_exec/PE1.lean` elaborates with zero errors and reports
  `PoolState.contract`'s only axioms as propext/Classical.choice/Quot.sound
  (none of EdDSAVerify/VerifyAccepts/VerifyOwnedAccepts, since `.contract` is
  a plain field projection) — exactly the spec's acceptance predicates. Ran
  `pre-commit run --all-files --hook-stage manual --verbose` (the merge
  boundary's own command, AGENTS.md "Lean work: standing rules"); all 8 hooks
  passed, including gate-baseline-fresh against the refreshed baseline.
