summary: >
  Proved finalizable_funded_pays in ArmadaLean/Nitro/Liveness.lean with no sorry, without
  changing its statement. The theorem combines a FundedFor strategy (which only guarantees
  reaching a directly-funded state in the future, unlike directly_funded_pays's immediate
  funding hypothesis) with directly_funded_pays's payout mechanics. Added: two UnbeatableIn
  combinators (UnbeatableIn.bind for sequential composition of strategies, UnbeatableIn.imp
  for postcondition weakening; UnbeatableIn.mono was relocated earlier in the file to stay
  available to its original caller); a funded_entry_step/funded_entry_round/
  funded_entry_honest_step/funded_entry_unbeatable family that tracks, through every honest
  move and adversary round a FundedFor strategy's game tree plays, that c's finalized outcome
  keeps an entry for d whose amount only grows and whose own total never grows past the
  original (so once the strategy reaches its target balance, the channel is genuinely
  DirectlyFunded, not just balance-sufficient for a stale total) and that
  Nitro.participant-reachability is preserved; and a HonestMove.Feasible.round lemma showing
  a committed honest move's feasibility (checked before an adversary round) still holds at
  the state it is actually applied to afterward (via NetworkState.Holds.mono, since a round
  only grows `received` and leaves `sent` unchanged). Verified by running
  `scripts/check.sh --json finalizable_funded_pays` (theorem_in_sorry: false,
  signatures_ok: true, build_ok: true, axioms_ok: true) and the full gate
  `lake build && scripts/check.sh` (exit 0, sorry count 22 against baseline 46, down from the
  21 theorem sorries plus the doc-comment mention, finalizable_funded_pays absent from the
  SORRY report).
