failure_diagnosis: >
  finalizable_unique needs an actual TWO-PARTICIPANT joint simulation, not a
  single-participant induction, and no infrastructure for that exists
  anywhere in ArmadaLean today (confirmed by grep across the whole Nitro
  directory and docs for "joint"/"interleav"/combinators spanning two
  UnbeatableIn trees: none found). The reason a one-sided argument cannot
  work: `hp : Finalizable apps (Ts.T p) c Ω (v p)` and
  `hq : Finalizable apps (Ts.T q) c Ω' (v q)` are each `Unbeatable` claims
  that only constrain ONE participant's own `NetworkState`; running either
  one alone against an idle adversary (`Threat.Round.exists`) produces a
  chain trajectory that never reflects the other participant's actions, so
  the two resulting `finalizedWith` facts live on two divergent,
  unconnected branches of `Adjudicator.Step` and `finalizedWith_stable`
  (Lemmas.lean:1190) cannot relate them. The only way to force Ω = Ω' is to
  construct ONE shared chain trajectory that is simultaneously a valid
  continuation of hp's tree (satisfying `Threat.Round`/`Threat.RoundSeq`
  under `Ts.T p`) and of hq's tree (under `Ts.T q`), with each
  participant's own on-chain calls/ticks echoed into the other's RoundSeq
  as `AdvMove.chain`/`AdvMove.tick` steps (licensed by `Capable.capable`/
  `capableTick` since p ≠ q and neither forges the other's signature).

  That construction is genuinely intricate, not merely "add a helper
  lemma": `Threat.RoundSeq.land`/`.chain`/`.deliver` are free (no clock
  cost) and can be echoed anywhere, but `HonestMove.wait dt` is UNBOUNDED
  for the participant issuing it (applied via `NetworkState.applyHonest`,
  outside any `Threat.Round` bound) while its reflection into the OTHER
  participant's RoundSeq is bounded per round by that other threat's own
  `T.ε` (`Threat.RoundSeq.tick`'s `hgate` plus `Threat.Round`'s outer
  `net'.chain.now < net.chain.now + T.ε`). Since `Ts.T p` and `Ts.T q` carry
  independent, unrelated ε values, a single large wait by one side must be
  absorbed into the other side's timeline across possibly MANY of that
  side's own rounds — which requires that side's own `UnbeatableIn` tree to
  keep offering rounds (via its `move` recursion) until the wait is fully
  absorbed OR that side reaches `done` first (in which case
  `finalizedWith_stable` closes the argument immediately, since the
  now-finalized chain is a prefix of everything that follows). I worked out
  a concrete, believed-correct design for this (outer structural induction
  on hp generalizing (netq, hq), with a nested wait-absorption induction on
  hq consuming its own rounds to match p's clock advance, symmetric for
  q's waits into p, invariant `netp.chain = netq.chain` maintained at every
  joint step via free call/tick echoing), but it requires several new
  general-purpose lemmas not present anywhere in the codebase (connecting
  `Threat.RoundSeq`/`NetworkState.applyAdv`/`applyHonest` to
  `Relation.ReflTransGen (Adjudicator.Step apps)`; a "finish one
  participant alone against an idle adversary" helper; the mutual
  wait-absorption recursion itself) and is on the order of several hundred
  lines of intricate, easy-to-get-subtly-wrong Lean. This matches the
  project's own 2026-10-27 re-audit (docs/nitro-repair-2026-10-27.md line
  72), which independently flags exactly this "joint play of two games with
  different ε" as unresolved, and lists THREE further theorems
  (channel_finalizability_cases, finalizable_or_two_enabled,
  single_enabled_is_finalizable) that depend on the same missing
  construction — i.e. this is prerequisite, reusable infrastructure work,
  not a one-theorem fix. I was not able to build and verify that
  infrastructure correctly within this session with the confidence the
  doctrine requires (no axiom, no weakened hypothesis, a real type-checking
  proof) rather than risk leaving a partially-built, non-compiling
  construction. The theorem's statement is unchanged; sorry is still the
  proof body. Recommend this be redispatched as a larger task (or split:
  first land the joint-simulation combinator as its own piece of
  infrastructure, then discharge finalizable_unique and the three dependent
  theorems against it).
