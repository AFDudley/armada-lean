summary: >
  finalizable_unique (ArmadaLean/Nitro/Liveness.lean) is true under the
  current model and now has a proof with no sorry. The statement did not
  change. #print axioms finalizable_unique lists only propext,
  Classical.choice and Quot.sound.

  Decision. The earlier diagnosis was right that one shared chain does not
  work: a wait is atomic, so a wait of p and a different wait of q cannot
  occur on one clock. The proof does not use one shared chain. Each
  participant keeps its own view and its own clock. A reaction of one
  participant lands its calls in its own round, and the same calls run in
  the view of the other participant as adversary .chain moves inside the
  round that is open there (mirror_land; Capable.capable allows them,
  because every signature of p or q that a view received is genuine). A
  wait moves only the clock of the participant that waits. The status of c
  stays equal on both chains up to the deadline of a running challenge
  (ChanAgree): an operation on c reads the mode and the turn record, not
  the clock, and a challenge sets its deadline from its own chain's clock
  (ChanAgree.apply). Any other operation keeps the status of c while c is
  not finalized. When both participants wait, q waits first if the running
  challenge pays Omega, else p waits first. Thus a wait that finalizes c
  gives Omega = Omega' (q waited) or contradicts the tree of p (p waited and
  the outcome is not Omega). A conclude finalizes c on both chains with one
  outcome, and both trees then give that outcome. Each step uses one move
  of one tree, so an induction on the tree of p, with an inner induction on
  the tree of q, ends the play (finalizable_joint). The different epsilon
  values do not matter: the play never ticks for the adversary, and every
  round ends at its start time. No proof step rests on an empty round as
  evidence for a universal claim: rounds appear only as instances of the
  two hypotheses' universal quantifiers.

  New code, all proved: the section "The joint play of two participants" in
  Liveness.lean before finalizable_unique (OtherSteps, ChanAgree,
  ChanAgreeOrFin, SigOK, JointGenuine, mirror_land, finalizable_joint and
  their lemmas). NetworkState.applyAdv_received_subset moved up, before its
  new users (text unchanged). Reachable.lean: new
  Nitro.network_received_signers, the received-signature invariant for
  every pair of participants, p = q included (the joint play needs the
  self-signature case); Nitro.network_views_signers is now its p /= q case.
  docs/nitro-repair-2026-10-27.md section 3 row 6: status proved, with the
  argument. The same joint-play lemmas are a possible base for
  channel_finalizability_cases (row 7) [INFERENCE].

